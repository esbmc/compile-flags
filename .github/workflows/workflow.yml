name: Development
on: push

jobs:
  pylint:
    name: PyLint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4.2.2

      # Setup Python (faster than using Python container)
      - name: Setup Python
        uses: actions/setup-python@v5.3.0
        with:
          python-version: "3.12.0"

      - name: Install Hatch
        run: python -m pip install --upgrade hatch

      - name: Get Hatch Dependency Hash
        run: echo "HATCH_DEP_HASH=$(hatch dep hash)" >> $GITHUB_ENV

      - name: Cache Hatch environment
        id: cache-hatch
        uses: actions/cache@v4.2.3
        with:
          path: |
            ~/.cache/hatch
            ~/.local/share/hatch
          key: ${{ runner.os }}-hatch-${{ env.HATCH_DEP_HASH }}

      # Run pylint once and capture output
      - name: Run Pylint on compile_flags
        run: |
          PYLINT_OUTPUT=$(hatch run pylint compile_flags || true)
          echo "$PYLINT_OUTPUT"
          SCORE=$(sed -n '$s/[^0-9]*\([0-9.]*\).*/\1/p' <<< "$PYLINT_OUTPUT")
          echo "PYLINT_SCORE=$SCORE" >> $GITHUB_ENV

      # Check if pass, the test command only takes integers so truncate decimals
      - name: Check If Pass (90%)
        run: test "${PYLINT_SCORE%.*}" -ge 9

  test:
    name: PyTest
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4.2.2

      # Setup Python (faster than using Python container)
      - name: Setup Python
        uses: actions/setup-python@v5.3.0
        with:
          python-version: "3.12.0"

      - name: Install Hatch
        run: python -m pip install --upgrade hatch

      - name: Get Hatch Dependency Hash
        run: echo "HATCH_DEP_HASH=$(hatch dep hash)" >> $GITHUB_ENV

      - name: Cache Hatch environment
        id: cache-hatch
        uses: actions/cache@v4.2.3
        with:
          path: |
            ~/.cache/hatch
            ~/.local/share/hatch
          key: ${{ runner.os }}-hatch-${{ env.HATCH_DEP_HASH }}

      - name: Run test suite
        run: hatch test

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4.2.2

      # Setup Python (faster than using Python container)
      - name: Setup Python
        uses: actions/setup-python@v5.3.0
        with:
          python-version: "3.12.0"

      - name: Install Hatch
        run: python -m pip install --upgrade hatch

      - name: Get Hatch Dependency Hash
        run: echo "HATCH_DEP_HASH=$(hatch dep hash)" >> $GITHUB_ENV

      - name: Cache Hatch environment
        id: cache-hatch
        uses: actions/cache@v4.2.3
        with:
          path: |
            ~/.cache/hatch
            ~/.local/share/hatch
          key: ${{ runner.os }}-hatch-${{ env.HATCH_DEP_HASH }}

      - name: Hatch build
        run: hatch build

      - name: Upload build files
        uses: actions/upload-artifact@v4.4.3
        with:
          name: build
          path: dist
